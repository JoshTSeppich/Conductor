<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Foxworks Workstation — CC Console</title>
    <link rel="stylesheet" href="./xterm.css" />
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 0;
        background: #0a0a0a;
        color: #d4d4d4;
      }
      #console-root {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      [data-testid='console-panel-empty'] {
        padding: 16px;
        color: #888;
      }
      [data-testid='console-panel-header'] {
        padding: 8px 12px;
        background: #1f1f1f;
        border-bottom: 1px solid #303030;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      [data-testid='console-panel-header'] span {
        font-weight: 600;
        flex: 1;
      }
      [data-testid='console-panel-header'] button {
        font-size: 11px;
        padding: 3px 8px;
        background: #2a2a2a;
        color: #d4d4d4;
        border: 1px solid #404040;
        border-radius: 3px;
        cursor: pointer;
      }
      [data-testid='console-panel-header'] button:hover {
        background: #353535;
      }
      [data-testid='console-gap-warning'],
      [data-testid='console-error-banner'] {
        padding: 8px 12px;
        font-size: 12px;
      }
      [data-testid='console-gap-warning'] {
        background: #4a3500;
        color: #ffcd66;
        border-bottom: 1px solid #6a4d00;
      }
      [data-testid='console-error-banner'] {
        background: #4a1f1f;
        color: #ff8888;
        border-bottom: 1px solid #6a2a2a;
      }
      [data-testid='console-terminal'] {
        flex: 1;
        min-height: 200px;
        padding: 4px;
      }
      [data-testid='console-prompt-form'] {
        display: flex;
        gap: 6px;
        padding: 6px 8px;
        background: #181818;
        border-top: 1px solid #303030;
      }
      [data-testid='console-prompt-input'] {
        flex: 1;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono',
          'Courier New', monospace;
        font-size: 13px;
        background: #0a0a0a;
        color: #d4d4d4;
        border: 1px solid #303030;
        border-radius: 3px;
        padding: 4px 6px;
        resize: none;
      }
      [data-testid='console-prompt-send'] {
        padding: 4px 12px;
        background: #1f4d1f;
        color: #d4ffd4;
        border: 1px solid #2a6a2a;
        border-radius: 3px;
        cursor: pointer;
      }
      [data-testid='console-prompt-send']:hover {
        background: #2a6a2a;
      }
    </style>
  </head>
  <body>
    <div id="console-root"></div>
    <script src="./renderer.js"></script>
  </body>
</html>
