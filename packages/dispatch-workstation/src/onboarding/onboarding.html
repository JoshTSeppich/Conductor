<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Foxworks Workstation — Setup</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #1a1a1a;
        color: #e0e0e0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
          sans-serif;
      }
      #onboarding-root {
        height: 100%;
      }
      .onboarding-modal {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .onboarding-modal-overlay {
        display: none;
      }
      .onboarding-modal-content {
        background: #232323;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 28px 32px;
        max-width: 480px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
      }
      .onboarding-modal-content h2 {
        margin: 0 0 12px 0;
        font-size: 18px;
        font-weight: 600;
      }
      .onboarding-modal-content p {
        font-size: 13px;
        line-height: 1.5;
        color: #c0c0c0;
        margin: 0 0 16px 0;
      }
      .onboarding-modal-content input[type='password'] {
        width: 100%;
        background: #1a1a1a;
        color: #e0e0e0;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 8px 10px;
        font-size: 13px;
        font-family: inherit;
        box-sizing: border-box;
        margin-bottom: 12px;
      }
      .onboarding-modal-content button {
        background: #3a7a3a;
        color: #fff;
        border: 1px solid #4a8a4a;
        padding: 6px 16px;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
      }
      .onboarding-modal-content button:hover {
        background: #4a8a4a;
      }
      .onboarding-modal-content button:disabled {
        background: #2a2a2a;
        color: #666;
        border-color: #333;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="onboarding-root"></div>
    <script src="./renderer.js"></script>
  </body>
</html>
