<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Foxworks Workstation</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #1a1a1a;
        color: #e0e0e0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
          sans-serif;
      }
      #shell {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      #header-bar {
        flex-shrink: 0;
        height: 36px;
        background: #2a2a2a;
        border-bottom: 1px solid #444;
        display: flex;
        align-items: center;
        padding: 0 12px;
        gap: 8px;
      }
      #spawn-button {
        background: #3a7a3a;
        color: #fff;
        border: 1px solid #4a8a4a;
        padding: 4px 12px;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
      }
      #spawn-button:hover {
        background: #4a8a4a;
      }
      #kanban-region {
        flex: 1;
        min-height: 80px;
        overflow: hidden;
      }
      #kanban-region webview {
        width: 100%;
        height: 100%;
        display: block;
      }
      /* === MB-T12 WB12 tile-grid region (replaces single-panel console-tile-region) === */
      #console-tile-region {
        flex: 1 1 auto;
        min-height: 0;
        border-top: 1px solid #303030;
        background: #0a0a0a;
        overflow: hidden;
      }
      #tile-grid-root {
        height: 100%;
        width: 100%;
        display: block;
      }
      /* === end MB-T12 WB12 tile-grid region === */
      #splitter {
        height: 6px;
        background: #3a3a3a;
        cursor: ns-resize;
        flex-shrink: 0;
        transition: background 0.1s;
      }
      #splitter:hover,
      #splitter.dragging {
        background: #5a5a5a;
      }
      #chat-region {
        overflow: hidden;
        flex-shrink: 0;
      }
      #root {
        height: 100%;
      }
      #spawn-modal[hidden] {
        display: none;
      }
      #spawn-modal {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #spawn-modal-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
      }
      #spawn-modal-content {
        position: relative;
        background: #232323;
        border: 1px solid #444;
        border-radius: 6px;
        padding: 20px 24px;
        min-width: 420px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      }
      #spawn-modal-content h2 {
        margin: 0 0 16px 0;
        font-size: 16px;
        font-weight: 600;
      }
      .spawn-row {
        margin-bottom: 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .spawn-row label {
        font-size: 12px;
        color: #aaa;
      }
      .spawn-row-group {
        display: flex;
        gap: 6px;
      }
      .spawn-row input[type='text'] {
        flex: 1;
        background: #1a1a1a;
        color: #e0e0e0;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 6px 8px;
        font-size: 13px;
        font-family: inherit;
      }
      #spawn-browse-button {
        background: #3a3a3a;
        color: #e0e0e0;
        border: 1px solid #555;
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 12px;
        cursor: pointer;
      }
      .spawn-modal-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 16px;
      }
      .spawn-modal-buttons button {
        padding: 6px 14px;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
      }
      #spawn-cancel-button {
        background: transparent;
        color: #aaa;
        border: 1px solid #555;
      }
      #spawn-confirm-button {
        background: #3a7a3a;
        color: #fff;
        border: 1px solid #4a8a4a;
      }
      #spawn-confirm-button:disabled {
        background: #2a2a2a;
        color: #666;
        border-color: #333;
        cursor: not-allowed;
      }
      /* === MB-F-#83 spawn-result banner (Fix-B) === */
      #spawn-result-banner[hidden] {
        display: none;
      }
      #spawn-result-banner {
        position: fixed;
        top: 48px;
        right: 16px;
        z-index: 90;
        max-width: 420px;
        padding: 10px 14px 10px 12px;
        border-radius: 4px;
        font-size: 13px;
        line-height: 1.4;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      #spawn-result-banner.success {
        background: #1f3d1f;
        color: #d8f0d8;
        border: 1px solid #4a8a4a;
      }
      #spawn-result-banner.error {
        background: #3d1f1f;
        color: #f0d8d8;
        border: 1px solid #8a4a4a;
      }
      #spawn-result-banner-message {
        flex: 1;
        word-break: break-word;
      }
      #spawn-result-banner-dismiss {
        background: transparent;
        color: inherit;
        border: 1px solid currentColor;
        border-radius: 3px;
        padding: 2px 6px;
        font-size: 11px;
        cursor: pointer;
        opacity: 0.7;
      }
      #spawn-result-banner-dismiss:hover {
        opacity: 1;
      }
      /* === end MB-F-#83 spawn-result banner === */
    </style>
  </head>
  <body>
    <div id="shell">
      <div id="header-bar">
        <button id="spawn-button" data-testid="spawn-button" type="button">+ Spawn Session</button>
      </div>
      <div id="kanban-region">
        <webview id="kanban-webview" allowpopups preload="./card-bridge.cjs"></webview>
      </div>
      <!-- === MB-F-CONSOLE-T03 console tile region — Session C / Batch 6 ===
           Hidden by default; flipped to display:block by the inline script
           when the main process emits console-tile:show. Single-panel-in-
           shell scope (vision §10.10 ship-gate); multi-panel tiling is
           MB-T12 (re-scope). -->
      <!-- MB-T12 WB12: region hosts the tile-grid React tree (TileGridApp).
           The tile-grid renderer bundle (../tile-grid/renderer.js, loaded
           below) auto-mounts into #tile-grid-root on load. Region uses
           flex-grow with min-height:0 so kanban + chat regions get their
           share of vertical space; tile-grid auto-collapses to height:0
           when sessions.length===0 (TileGridApp returns null). -->
      <div id="console-tile-region" data-testid="console-tile-region">
        <div id="tile-grid-root" data-testid="tile-grid-root"></div>
      </div>
      <!-- === end MB-T12 WB12 tile-grid region === -->
      <div id="splitter" role="separator" aria-label="Resize panel" data-testid="splitter"></div>
      <div id="chat-region" style="height: 280px">
        <div id="root"></div>
      </div>
    </div>

    <!-- === MB-F-#83 spawn-result banner (Fix-B). Hidden by default;
         workstationBridge.onSpawnResult shows it on success (auto-dismiss
         after 3s) or error (persistent until dismissed). Operator-acked
         minimum-viable surfacing per finding #86. === -->
    <div
      id="spawn-result-banner"
      data-testid="spawn-result-banner"
      role="status"
      aria-live="polite"
      hidden
    >
      <div id="spawn-result-banner-message" data-testid="spawn-result-banner-message"></div>
      <button
        id="spawn-result-banner-dismiss"
        data-testid="spawn-result-banner-dismiss"
        type="button"
      >
        Dismiss
      </button>
    </div>

    <div id="spawn-modal" data-testid="spawn-modal" role="dialog" aria-modal="true" hidden>
      <div id="spawn-modal-overlay" data-testid="spawn-modal-overlay"></div>
      <div id="spawn-modal-content">
        <h2>Spawn New Session</h2>
        <div class="spawn-row">
          <label for="spawn-repo-path">Repository path</label>
          <div class="spawn-row-group">
            <input
              id="spawn-repo-path"
              data-testid="spawn-repo-path"
              type="text"
              placeholder="/path/to/repo"
              autocomplete="off"
              spellcheck="false"
            />
            <button id="spawn-browse-button" data-testid="spawn-browse-button" type="button">
              Browse…
            </button>
          </div>
        </div>
        <div class="spawn-row">
          <label for="spawn-session-name">Session name</label>
          <input
            id="spawn-session-name"
            data-testid="spawn-session-name"
            type="text"
            placeholder="my-session"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <div class="spawn-modal-buttons">
          <button id="spawn-cancel-button" data-testid="spawn-cancel-button" type="button">
            Cancel
          </button>
          <button id="spawn-confirm-button" data-testid="spawn-confirm-button" type="button">
            Spawn
          </button>
        </div>
      </div>
    </div>

    <script>
      const kanbanWebview = document.getElementById('kanban-webview');
      const chatRegion = document.getElementById('chat-region');
      const splitter = document.getElementById('splitter');

      const DEFAULT_CHAT_HEIGHT = 280;
      let chatHeight = DEFAULT_CHAT_HEIGHT;

      // WEB_UI_URL passed from main.ts via loadFile({ query: { webUiUrl: '...' } }).
      const params = new URLSearchParams(window.location.search);
      const webUiUrl = params.get('webUiUrl') || 'http://localhost:7878';
      kanbanWebview.setAttribute('src', webUiUrl);

      async function initSplitter() {
        if (window.shellBridge) {
          try {
            const saved = await window.shellBridge.getSplitterPos();
            if (typeof saved === 'number' && saved > 80) {
              chatHeight = saved;
              chatRegion.style.height = chatHeight + 'px';
            }
          } catch (err) {
            console.error('initSplitter getSplitterPos error: ' + err);
          }
        } else {
          console.error('shellBridge not available in renderer');
        }
        // Sentinel: forwarded by main.ts console-message handler (MB_TEST_HOOKS gated).
        console.log('SPLITTER_LOADED ' + chatHeight);
      }

      // Draggable splitter — drag up to expand chat, drag down to shrink.
      let isDragging = false;
      let dragStartY = 0;
      let dragStartHeight = 0;

      splitter.addEventListener('mousedown', (e) => {
        isDragging = true;
        dragStartY = e.clientY;
        dragStartHeight = chatRegion.offsetHeight;
        splitter.classList.add('dragging');
        document.body.style.userSelect = 'none';
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const delta = dragStartY - e.clientY;
        const maxHeight = window.innerHeight - 100;
        chatHeight = Math.max(80, Math.min(maxHeight, dragStartHeight + delta));
        chatRegion.style.height = chatHeight + 'px';
      });

      document.addEventListener('mouseup', () => {
        if (!isDragging) return;
        isDragging = false;
        splitter.classList.remove('dragging');
        document.body.style.userSelect = '';
        if (window.shellBridge) {
          window.shellBridge.saveSplitterPos(chatHeight);
        }
      });

      // ────────────────────────────────────────────────────────────────────────
      // MB-T04: spawn modal — header [+ Spawn Session] opens, [Cancel]/Esc close,
      // [Browse…] invokes native dir dialog via workstationBridge.openRepoDialog,
      // [Spawn] fires workstation:spawn-requested IPC via requestSpawn().
      // SPAWN_MODAL_OPENED sentinel (MB_TEST_HOOKS=1) emitted on modal open;
      // SPAWN_REQUESTED <json> sentinel emitted from main process spawn-ipc.ts.
      // ────────────────────────────────────────────────────────────────────────
      const spawnButton = document.getElementById('spawn-button');
      const spawnModal = document.getElementById('spawn-modal');
      const spawnRepoPathInput = document.getElementById('spawn-repo-path');
      const spawnSessionNameInput = document.getElementById('spawn-session-name');
      const spawnBrowseButton = document.getElementById('spawn-browse-button');
      const spawnCancelButton = document.getElementById('spawn-cancel-button');
      const spawnConfirmButton = document.getElementById('spawn-confirm-button');

      function openSpawnModal() {
        spawnModal.hidden = false;
        spawnRepoPathInput.focus();
        console.log('SPAWN_MODAL_OPENED');
      }

      function closeSpawnModal() {
        spawnModal.hidden = true;
        spawnRepoPathInput.value = '';
        spawnSessionNameInput.value = '';
      }

      spawnButton.addEventListener('click', openSpawnModal);
      spawnCancelButton.addEventListener('click', closeSpawnModal);

      spawnBrowseButton.addEventListener('click', async () => {
        if (!window.workstationBridge) {
          console.error('workstationBridge not available');
          return;
        }
        try {
          const path = await window.workstationBridge.openRepoDialog();
          if (typeof path === 'string' && path.length > 0) {
            spawnRepoPathInput.value = path;
          }
        } catch (err) {
          console.error('openRepoDialog error: ' + err);
        }
      });

      spawnConfirmButton.addEventListener('click', () => {
        const repoPath = spawnRepoPathInput.value.trim();
        const sessionName = spawnSessionNameInput.value.trim();
        if (!repoPath || !sessionName) return;
        if (window.workstationBridge) {
          window.workstationBridge.requestSpawn({ repoPath, sessionName });
        } else {
          console.error('workstationBridge not available — cannot fire spawn intent');
        }
        closeSpawnModal();
      });

      // Esc closes modal.
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !spawnModal.hidden) closeSpawnModal();
      });

      // ────────────────────────────────────────────────────────────────────────
      // MB-F-#83 spawn-result subscription (Fix-B / batch fix-batch-1).
      //
      // Closes the silent-spawn-UX defect: every spawn attempt reaches the
      // main process via 'workstation:spawn-requested', and main replies via
      // 'workstation:spawn-result' (spawn-ipc.ts:297 / :308). Until this
      // wiring landed, the renderer never subscribed — modal flashed closed
      // and the operator had no UI feedback for success or any failure mode
      // (cap-block, daemon unreachable, claude-bin missing, etc.).
      //
      // Surfacing UX: small inline banner top-right of the shell. Success
      // auto-dismisses after 3s; error persists until the operator clicks
      // Dismiss (or another result arrives). Console.log sentinels emitted
      // for the smoke harness's MB-F-MB-T08-SPAWN-RESULT-SENTINEL closer:
      //   SPAWN_RESULT_OK <sessionName>
      //   SPAWN_RESULT_ERROR <error_type> <message>
      // Forwarded by main.ts (Fix-B sentinel region) under MB_TEST_HOOKS=1.
      //
      // Richer toast/notification UX system tracked as finding #86.
      // ────────────────────────────────────────────────────────────────────────
      const spawnResultBanner = document.getElementById('spawn-result-banner');
      const spawnResultBannerMessage = document.getElementById(
        'spawn-result-banner-message',
      );
      const spawnResultBannerDismiss = document.getElementById(
        'spawn-result-banner-dismiss',
      );
      let spawnResultAutoDismissTimer = null;

      function hideSpawnResultBanner() {
        if (spawnResultAutoDismissTimer !== null) {
          clearTimeout(spawnResultAutoDismissTimer);
          spawnResultAutoDismissTimer = null;
        }
        spawnResultBanner.hidden = true;
        spawnResultBanner.classList.remove('success', 'error');
      }

      function showSpawnResultBanner(kind, text, autoDismissMs) {
        if (spawnResultAutoDismissTimer !== null) {
          clearTimeout(spawnResultAutoDismissTimer);
          spawnResultAutoDismissTimer = null;
        }
        spawnResultBanner.classList.remove('success', 'error');
        spawnResultBanner.classList.add(kind);
        spawnResultBannerMessage.textContent = text;
        spawnResultBanner.hidden = false;
        if (typeof autoDismissMs === 'number' && autoDismissMs > 0) {
          spawnResultAutoDismissTimer = setTimeout(
            hideSpawnResultBanner,
            autoDismissMs,
          );
        }
      }

      spawnResultBannerDismiss.addEventListener('click', hideSpawnResultBanner);

      function handleSpawnResult(reply) {
        if (!reply || typeof reply !== 'object') return;
        if (reply.type === 'success') {
          const name =
            (reply.result && reply.result.sessionName) || '(unnamed)';
          showSpawnResultBanner('success', 'Session "' + name + '" spawned.', 3000);
          console.log('SPAWN_RESULT_OK ' + name);
          return;
        }
        if (reply.type === 'error') {
          const errType = (reply.error && reply.error.error_type) || 'SpawnFailed';
          const errMsg = (reply.error && reply.error.message) || '(no message)';
          showSpawnResultBanner('error', errType + ': ' + errMsg, 0);
          console.log('SPAWN_RESULT_ERROR ' + errType + ' ' + errMsg);
        }
      }

      if (
        window.workstationBridge &&
        typeof window.workstationBridge.onSpawnResult === 'function'
      ) {
        window.workstationBridge.onSpawnResult(handleSpawnResult);
      } else {
        console.error(
          'workstationBridge.onSpawnResult not available — spawn results will be silent',
        );
      }

      // ────────────────────────────────────────────────────────────────────────
      // MB-F-CONSOLE-T03-SHELL-INTEGRATION (Session C / Batch 6).
      //
      // Subscribe to consoleBridge open/close so the tile region toggles
      // visibility. The bridge is exposed by preload.mts via contextBridge;
      // these subscriptions fire whether the open trigger came from the
      // native CC Console menu (CONSOLE-T03 menu surface) or from a future
      // spawn-auto-mount path (batch 7+). Single-panel scope: each open/close
      // simply flips the region's display; MB-T12 will replace this with
      // per-tile mount/unmount inside #console-tile-grid.
      //
      // MB-T12 WB12: tile-grid React tree (TileGridApp) auto-mounts into
      // #tile-grid-root via ../tile-grid/renderer.js. The pre-MB-T12 inline
      // toggle (window.consoleBridge.onConsoleOpen → display:block on
      // #console-tile-region) was DELETED in WB12 — TileGridApp manages
      // its own visibility (returns null when sessions.length===0, so the
      // grid collapses to zero height naturally; flex layout reclaims the
      // space for kanban + chat).
      // ────────────────────────────────────────────────────────────────────────

      initSplitter().then(() => {
        console.log('SHELL_READY');
      });
    </script>
    <!-- D's renderer bundle: auto-mounts ChatPanel into #root with stub DaemonClient.
         Round 2: contextBridge bridge wired in preload.ts for COARCH-T03 consumption. -->
    <script src="../coarchitect/renderer.js"></script>
    <!-- MB-F-CONSOLE-T03 console-panel renderer: keeps the standalone-window
         path (WB11 detached BrowserWindow loads console-panel.html with a
         ?session=<name> query param; the auto-mount block reads the URL).
         In the workstation shell context (no #console-root, no ?session=),
         the auto-mount returns reason='no-root' and does nothing. -->
    <script src="../console-panel/renderer.js"></script>
    <!-- MB-T12 WB12 tile-grid renderer: auto-mounts <TileGridApp> into
         #tile-grid-root via window.workstationBridge + window.consoleBridge. -->
    <script src="../tile-grid/renderer.js"></script>
  </body>
</html>
