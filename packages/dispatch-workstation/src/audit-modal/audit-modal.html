<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Recent Orchestrator Actions</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #1a1a1a;
        color: #e0e0e0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
          sans-serif;
      }
      #audit-modal-root {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .audit-modal {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 16px;
        box-sizing: border-box;
      }
      .audit-modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .audit-modal-title {
        font-size: 16px;
        font-weight: 600;
      }
      .audit-modal-total {
        font-size: 12px;
        color: #888;
      }
      .audit-modal-list {
        flex: 1;
        overflow-y: auto;
        background: #232323;
        border: 1px solid #333;
        border-radius: 6px;
      }
      .audit-modal-row {
        padding: 8px 12px;
        border-bottom: 1px solid #2c2c2c;
        cursor: pointer;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 12px;
      }
      .audit-modal-row:hover {
        background: #2a2a2a;
      }
      .audit-modal-row-summary {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .audit-modal-row-ts {
        color: #888;
        flex: 0 0 auto;
        min-width: 180px;
      }
      .audit-modal-row-session {
        color: #6cb6ff;
        flex: 0 0 auto;
        min-width: 120px;
      }
      .audit-modal-row-action {
        color: #d2a8ff;
        flex: 0 0 auto;
        min-width: 130px;
      }
      .audit-modal-row-status {
        color: #aaa;
      }
      .audit-modal-row-status.fired {
        color: #7ee787;
      }
      .audit-modal-row-status.failed {
        color: #ff7b72;
      }
      .audit-modal-row-status.pending {
        color: #f0b73d;
      }
      .audit-modal-row-expanded {
        margin-top: 8px;
        padding: 8px;
        background: #1a1a1a;
        border-radius: 4px;
        white-space: pre-wrap;
        word-break: break-all;
        font-size: 11px;
      }
      .audit-modal-empty,
      .audit-modal-error,
      .audit-modal-loading {
        padding: 32px;
        text-align: center;
        color: #888;
      }
      .audit-modal-error {
        color: #ff7b72;
      }
      .audit-modal-close {
        background: #333;
        color: #e0e0e0;
        border: 1px solid #444;
        padding: 6px 14px;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
      }
      .audit-modal-close:hover {
        background: #404040;
      }
    </style>
  </head>
  <body>
    <div id="audit-modal-root"></div>
    <script src="renderer.js"></script>
  </body>
</html>
