<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Conductor V_MVP</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* dark by default */
    --bg:           #0a0a0b;
    --bg-elev:      #0f0f12;
    --panel:        #131318;
    --panel-2:      #181820;
    --border:       #23232b;
    --border-soft:  #1c1c23;
    --text:         #ececef;
    --text-dim:     #8a8a93;
    --text-mute:    #5a5a63;
    --mono:         #c8c8cc;
    --mono-dim:     #6e6e78;
    --ok:           #6ad4b8;
    --warn:         #f0a062;
    --err:          #e07472;
    --accent:       #f0a062;
    --user-bubble:  #1c1c24;
    --user-bubble-border: #2a2a34;
    --kbd-bg:       #1c1c24;
    --kbd-fg:       #b8b8c0;
  }
  :root[data-theme="light"] {
    --bg:           #f6f5f1;
    --bg-elev:      #ffffff;
    --panel:        #ffffff;
    --panel-2:      #f0eee8;
    --border:       #dcd9d0;
    --border-soft:  #e8e5dc;
    --text:         #1a1a1c;
    --text-dim:     #6a6a72;
    --text-mute:    #9a9aa2;
    --mono:         #2a2a32;
    --mono-dim:     #7a7a82;
    --ok:           #1f9d6f;
    --warn:         #c87330;
    --err:          #c44a47;
    --user-bubble:  #eceae2;
    --user-bubble-border: #d8d4ca;
    --kbd-bg:       #efeee8;
    --kbd-fg:       #4a4a52;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); }
  body {
    font-family: 'Geist', ui-sans-serif, sans-serif;
    font-feature-settings: 'ss01', 'cv11';
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }
  #root { height: 100%; }

  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  button:disabled { cursor: not-allowed; opacity: 0.4; }
  textarea { font: inherit; color: inherit; background: none; border: none; resize: none; outline: none; }
  textarea::placeholder { color: var(--text-mute); }
  kbd {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    background: var(--kbd-bg);
    color: var(--kbd-fg);
    padding: 1px 5px;
    border-radius: 3px;
    border: 1px solid var(--border);
  }

  /* ── App shell ──────────────────────────────────────────────────────── */
  .app {
    display: grid;
    grid-template-rows: 36px 1fr;
    height: 100vh;
    background: var(--bg);
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-elev);
    font-size: 12px;
    color: var(--text-dim);
    gap: 10px;
  }
  .topbar-left, .topbar-right { display: flex; align-items: center; gap: 10px; }
  .topbar-sep { width: 1px; height: 14px; background: var(--border); }
  .topbar-meta { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.01em; white-space: nowrap; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-glyph { color: var(--accent); font-size: 14px; }
  .brand-name { color: var(--text); font-weight: 600; letter-spacing: -0.01em; font-size: 13px; }
  .brand-version {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text-mute);
    padding: 1px 5px;
    border: 1px solid var(--border);
    border-radius: 3px;
  }

  .workspace {
    display: grid;
    grid-template-rows: 1.35fr 1fr;
    min-height: 0;
    overflow: hidden;
    gap: 0;
  }

  /* ── Region labels ──────────────────────────────────────────────────── */
  .region-label {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px 0 14px;
    height: 24px;
  }
  .region-label-bottom { padding-top: 6px; }
  .region-label-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--text-mute);
  }
  .region-label-line {
    flex: 1; height: 1px;
    background: linear-gradient(to right, var(--border) 0%, var(--border-soft) 60%, transparent);
  }

  /* ── Orchestrator region ────────────────────────────────────────────── */
  .orchestrator-region {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    padding: 0 14px 8px 14px;
    min-height: 0;
    overflow: hidden;
  }
  .orchestrator-grid {
    display: grid;
    gap: 10px;
    min-height: 0;
  }
  .app-layout-side .orchestrator-grid { grid-template-columns: 1.7fr 1fr; grid-template-rows: minmax(0, 1fr); }
  .app-layout-bottom .orchestrator-grid { grid-template-rows: minmax(0, 1.5fr) minmax(0, 1fr); }

  .orch-main-slot { min-width: 0; min-height: 0; }
  .agent-grid {
    display: grid;
    gap: 8px;
    min-height: 0;
    min-width: 0;
    overflow: auto;
    align-content: start;
  }
  .app-layout-side .agent-grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: minmax(0, 1fr); }
  .app-layout-bottom .agent-grid { grid-template-columns: repeat(4, 1fr); grid-auto-rows: minmax(0, 1fr); }
  .app-density-compact .agent-grid { gap: 6px; }
  .app-density-compact.app-layout-side .agent-grid { grid-template-columns: repeat(2, 1fr); }
  .app-density-compact.app-layout-bottom .agent-grid { grid-template-columns: repeat(5, 1fr); }

  .agent-empty {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-mute);
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 24px;
  }

  /* ── Orchestrator main slot becomes a stack: strip on top, log below ── */
  .orch-main-slot {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    gap: 8px;
    min-width: 0; min-height: 0;
  }

  /* ── Orchestrator progress strip ────────────────────────────────────── */
  .ostrip {
    background: var(--panel);
    border: 1px solid color-mix(in oklab, var(--accent) 25%, var(--border));
    border-radius: 6px;
    padding: 10px 12px 12px 12px;
    display: grid;
    grid-template-rows: auto auto auto;
    gap: 8px;
  }
  .ostrip-header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 22px;
    flex-wrap: wrap;
  }
  .ostrip-title { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 auto; }
  .ostrip-mark { color: var(--accent); font-size: 14px; line-height: 1; }
  .ostrip-title-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .ostrip-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--text-mute);
    padding: 1px 6px;
    border: 1px solid var(--border);
    border-radius: 99px;
    flex-shrink: 0;
  }
  .ostrip-stats { display: flex; align-items: stretch; gap: 14px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .ostrip-stat { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
  .ostrip-stat-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    color: var(--text-mute);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .ostrip-stat-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    margin-top: 1px;
  }

  .ostrip-bar {
    display: flex;
    height: 5px;
    background: color-mix(in oklab, var(--border) 80%, transparent);
    border-radius: 99px;
    overflow: hidden;
  }
  .ostrip-bar-seg { height: 100%; transition: width 240ms ease; }
  .ostrip-bar-done { background: var(--ok); }
  .ostrip-bar-running {
    background: var(--accent);
    background-image: linear-gradient(90deg,
      color-mix(in oklab, var(--accent) 80%, transparent) 0%,
      var(--accent) 50%,
      color-mix(in oklab, var(--accent) 80%, transparent) 100%);
    background-size: 30px 100%;
    animation: barShimmer 1.4s linear infinite;
  }
  .ostrip-bar-queued { background: var(--border); }
  @keyframes barShimmer {
    0%   { background-position: 0 0; }
    100% { background-position: 30px 0; }
  }

  .ostrip-footer {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .ostrip-slots-wrap { flex: 1; min-width: 0; }
  .ostrip-slots {
    display: grid;
    grid-template-columns: repeat(auto-fill, 10px);
    grid-auto-rows: 10px;
    gap: 3px;
    max-height: 36px;
    overflow: hidden;
  }
  .ostrip-slot {
    width: 10px; height: 10px;
    border-radius: 2px;
    background: var(--border);
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: transform 120ms ease, background 200ms ease;
    padding: 0;
    border: none;
  }
  .ostrip-slot:hover:not(:disabled) { transform: scale(1.4); z-index: 1; }
  .ostrip-slot:disabled { cursor: default; }
  .ostrip-slot-empty    { background: color-mix(in oklab, var(--border) 60%, transparent); }
  .ostrip-slot-starting { background: var(--warn); }
  .ostrip-slot-running  { background: var(--ok); }
  .ostrip-slot-done     { background: color-mix(in oklab, var(--ok) 30%, var(--border)); }
  .ostrip-slot-error    { background: var(--err); }
  .ostrip-slot-pulse {
    position: absolute; inset: 0;
    background: var(--ok);
    opacity: 0.4;
    animation: slotPulse 1.6s ease-in-out infinite;
  }
  @keyframes slotPulse {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 0.7; }
  }

  .ostrip-legend {
    display: flex; align-items: center; gap: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    color: var(--text-mute);
    flex-shrink: 0;
  }
  .ostrip-legend span { display: inline-flex; align-items: center; gap: 4px; }
  .ostrip-legend .leg {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 2px;
  }
  .leg-running  { background: var(--ok); }
  .leg-starting { background: var(--warn); }
  .leg-done     { background: color-mix(in oklab, var(--ok) 30%, var(--border)); }
  .leg-error    { background: var(--err); }
  .leg-empty    { background: color-mix(in oklab, var(--border) 60%, transparent); }

  /* ── Mini tiles (when agent count grows large) ───────────────────────── */
  .agent-grid.agent-grid-mini { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); grid-auto-rows: 36px; gap: 4px; }
  .tmux-mini {
    display: grid;
    grid-template-columns: 8px 1fr auto;
    align-items: center;
    gap: 6px;
    padding: 0 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    height: 100%;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 120ms ease, transform 120ms ease;
  }
  .tmux-mini:hover { border-color: color-mix(in oklab, var(--accent) 35%, var(--border)); }
  .tmux-mini-dot {
    width: 6px; height: 6px; border-radius: 99px;
    background: var(--mono-dim);
  }
  .tmux-mini-running .tmux-mini-dot { background: var(--ok); box-shadow: 0 0 4px var(--ok); }
  .tmux-mini-starting .tmux-mini-dot { background: var(--warn); animation: pulse 1.1s ease-in-out infinite; }
  .tmux-mini-error .tmux-mini-dot { background: var(--err); }
  .tmux-mini-done .tmux-mini-dot { background: var(--mono-dim); }
  .tmux-mini-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tmux-mini-elapsed {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    color: var(--text-mute);
  }

  /* ── Tmux pane ──────────────────────────────────────────────────────── */
  .tmux-pane {
    display: grid;
    grid-template-rows: 24px 1fr;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    min-height: 0;
    min-width: 0;
    position: relative;
    transition: border-color 160ms ease, box-shadow 160ms ease, transform 200ms ease;
  }
  .tmux-pane.tmux-big {
    border-color: color-mix(in oklab, var(--accent) 35%, var(--border));
    box-shadow:
      0 0 0 1px color-mix(in oklab, var(--accent) 15%, transparent) inset,
      0 8px 30px -10px rgba(0,0,0,0.5);
  }
  .tmux-pane.tmux-small:hover { border-color: color-mix(in oklab, var(--accent) 30%, var(--border)); }
  .tmux-pane.tmux-focused { border-color: var(--accent); }
  .tmux-pane.tmux-done .tmux-body { opacity: 0.55; }
  .tmux-pane.tmux-error { border-color: color-mix(in oklab, var(--err) 40%, var(--border)); }

  .tmux-titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border-soft);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--text-dim);
    user-select: none;
    gap: 8px;
    min-width: 0;
  }
  .tmux-titlebar-left, .tmux-titlebar-right {
    display: flex; align-items: center; gap: 6px; min-width: 0;
  }
  .tmux-titlebar-left { flex: 1; min-width: 0; }
  .tmux-name { color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tmux-cmd { color: var(--text-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tmux-meta { color: var(--text-mute); white-space: nowrap; }
  .tmux-sep { color: var(--text-mute); white-space: nowrap; }

  .tmux-body {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    line-height: 1.45;
    color: var(--mono);
    padding: 8px 10px 10px 10px;
    overflow: auto;
    min-height: 0;
    background:
      radial-gradient(ellipse at top, rgba(255,255,255,0.015) 0%, transparent 60%),
      var(--panel);
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .tmux-body::-webkit-scrollbar { width: 6px; height: 6px; }
  .tmux-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .tmux-line {
    white-space: pre;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tmux-prompt { color: var(--mono); }
  .tmux-cursor {
    display: inline-block;
    width: 0.55em;
    height: 1em;
    background: var(--accent);
    vertical-align: text-bottom;
    animation: blink 1.05s steps(1) infinite;
    margin-left: 2px;
    opacity: 0.85;
  }
  .tmux-spawning {
    color: var(--warn);
    font-style: italic;
  }

  @keyframes blink { 0%, 50% { opacity: 0.85; } 50.01%, 100% { opacity: 0; } }
  @keyframes pulse {
    0%, 100% { transform: scale(1);   opacity: 1; }
    50%      { transform: scale(1.4); opacity: 0.6; }
  }
  @keyframes paneIn {
    0%   { transform: scale(0.86) translateY(8px); opacity: 0; }
    60%  { opacity: 1; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  @keyframes paneOut {
    0%   { transform: scale(1) translateY(0); opacity: 1; filter: blur(0); }
    100% { transform: scale(0.94) translateY(-4px); opacity: 0; filter: blur(2px); }
  }

  /* ── Conductor chat region ──────────────────────────────────────────── */
  .conductor-region {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    padding: 0 14px 12px 14px;
    min-height: 0;
    overflow: hidden;
  }
  .conductor {
    display: grid;
    grid-template-rows: 36px 1fr auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    min-height: 0;
  }
  .conductor-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    border-bottom: 1px solid var(--border-soft);
    background: var(--panel-2);
    font-size: 12px;
  }
  .conductor-title { display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: 500; }
  .conductor-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px; height: 18px;
    background: var(--accent);
    color: #0a0a0b;
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 700;
  }
  .conductor-sep { color: var(--text-mute); margin: 0 2px; }
  .conductor-file { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--text-dim); }
  .conductor-progress {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--text-mute);
    padding: 1px 6px;
    border: 1px solid var(--border);
    border-radius: 99px;
  }
  .conductor-controls { display: flex; align-items: center; gap: 6px; }
  .ctrl-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    transition: all 120ms ease;
  }
  .ctrl-btn:hover { border-color: var(--accent); color: var(--text); }
  .ctrl-btn-danger:hover { border-color: var(--err); color: var(--err); }

  .conductor-thread {
    overflow-y: auto;
    padding: 18px 0 8px 0;
    min-height: 0;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .conductor-thread::-webkit-scrollbar { width: 6px; }
  .conductor-thread::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg { padding: 0 22px; margin-bottom: 14px; max-width: 780px; margin-left: auto; margin-right: auto; }
  .msg-user { display: flex; justify-content: flex-end; }
  .msg-user-bubble {
    background: var(--user-bubble);
    border: 1px solid var(--user-bubble-border);
    padding: 8px 13px;
    border-radius: 16px;
    border-top-right-radius: 4px;
    max-width: 70%;
    font-size: 14px;
    line-height: 1.45;
    color: var(--text);
  }
  .msg-assistant { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; }
  .msg-assistant-mark {
    width: 22px; height: 22px;
    border-radius: 5px;
    background: var(--accent);
    color: #0a0a0b;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    margin-top: 1px;
  }
  .msg-assistant-body { font-size: 14px; line-height: 1.55; color: var(--text); }
  .msg-assistant-body p { margin: 0 0 6px 0; text-wrap: pretty; }
  .msg-assistant-body p:last-child { margin-bottom: 0; }

  .msg-typing .typing-dot {
    display: inline-block;
    width: 5px; height: 5px;
    background: var(--text-mute);
    border-radius: 99px;
    margin-right: 3px;
    animation: typing 1.1s ease-in-out infinite;
  }
  .msg-typing .typing-dot:nth-child(2) { animation-delay: 0.18s; }
  .msg-typing .typing-dot:nth-child(3) { animation-delay: 0.36s; }
  .typing-label { color: var(--text-mute); font-size: 12.5px; margin-left: 6px; }
  @keyframes typing {
    0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
    40%           { opacity: 1;   transform: translateY(-2px); }
  }

  /* Dispatch row — distinct visual treatment so the user can scan handoffs */
  .msg-dispatch {
    display: grid;
    grid-template-columns: 4px 1fr;
    gap: 12px;
    padding-left: 22px;
  }
  .dispatch-rule {
    background: linear-gradient(to bottom, var(--accent), color-mix(in oklab, var(--accent) 30%, transparent));
    border-radius: 99px;
  }
  .dispatch-body { padding: 2px 0; }
  .dispatch-head {
    display: flex; align-items: center; gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--text-mute);
    margin-bottom: 3px;
  }
  .dispatch-badge {
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.12em;
  }
  .dispatch-step { color: var(--text-mute); }
  .dispatch-arrow { color: var(--text-mute); }
  .dispatch-target { color: var(--text); font-weight: 500; }
  .dispatch-task {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--text);
    line-height: 1.45;
  }

  .msg-system {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--text-mute);
    text-align: center;
  }
  .sys-dot {
    display: inline-block;
    width: 4px; height: 4px;
    background: var(--text-mute);
    border-radius: 99px;
    vertical-align: middle;
    margin-right: 5px;
  }

  /* Composer */
  .conductor-composer {
    padding: 10px 16px 14px 16px;
    border-top: 1px solid var(--border-soft);
    background: var(--panel);
  }
  .composer-attachments {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .buildmd-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 4px 8px 4px 8px;
    border-radius: 6px;
    color: var(--text-dim);
    font-size: 12px;
  }
  .buildmd-chip-name { color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; }
  .buildmd-chip-meta {
    color: var(--text-mute);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    padding-left: 6px;
    border-left: 1px solid var(--border);
  }
  .buildmd-chip-x {
    color: var(--text-mute);
    font-size: 16px;
    line-height: 1;
    padding: 0 2px;
  }
  .buildmd-chip-x:hover { color: var(--err); }
  .dispatch-next-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    padding: 4px 10px;
    border: 1px dashed color-mix(in oklab, var(--accent) 50%, var(--border));
    border-radius: 6px;
    transition: all 120ms ease;
  }
  .dispatch-next-btn:hover {
    background: color-mix(in oklab, var(--accent) 10%, transparent);
    border-style: solid;
  }

  .composer-row {
    display: grid;
    grid-template-columns: 28px 1fr 32px;
    gap: 8px;
    align-items: end;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px 10px;
    transition: border-color 120ms ease;
  }
  .composer-row:focus-within { border-color: color-mix(in oklab, var(--accent) 50%, var(--border)); }
  .composer-icon-btn {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim);
    border-radius: 6px;
    transition: all 120ms ease;
  }
  .composer-icon-btn:hover { background: var(--panel); color: var(--text); }
  .composer-input {
    width: 100%;
    min-height: 28px;
    max-height: 140px;
    padding: 4px 0;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    font-family: inherit;
  }
  .composer-send {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent);
    color: #0a0a0b;
    border-radius: 99px;
    transition: transform 120ms ease, opacity 120ms ease;
  }
  .composer-send:hover:not(:disabled) { transform: translateY(-1px); }
  .composer-send:disabled { background: var(--border); color: var(--text-mute); }

  .composer-hint {
    margin-top: 8px;
    font-size: 10.5px;
    color: var(--text-mute);
    text-align: center;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    flex-wrap: wrap;
  }
</style>
